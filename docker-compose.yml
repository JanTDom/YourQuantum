version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: yourquantum_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yourquantum}
      POSTGRES_USER: ${POSTGRES_USER:-yq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yq_secure_pass_local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yq_user -d yourquantum"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yourquantum_api
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-yq_user}:${POSTGRES_PASSWORD:-yq_secure_pass_local}@postgres:5432/${POSTGRES_DB:-yourquantum}
      YQ_EXECUTION_MODE: queue
      YQ_SESSION_SIGNING_SECRET: ${YQ_SESSION_SIGNING_SECRET:-}
      YQ_SIGNING_KEY: ${YQ_SIGNING_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yourquantum_worker
    command: ["python", "-m", "backend.worker.service"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-yq_user}:${POSTGRES_PASSWORD:-yq_secure_pass_local}@postgres:5432/${POSTGRES_DB:-yourquantum}
      YQ_EXECUTION_MODE: queue
      YQ_SIGNING_KEY: ${YQ_SIGNING_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
